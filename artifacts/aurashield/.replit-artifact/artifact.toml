kind = "web"
previewPath = "/"
title = "AuraShield AI"
version = "1.0.0"
id = "artifacts/aurashield"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25127

[services.development]
run = "pnpm --filter @workspace/aurashield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aurashield", "run", "build" ]
publicDir = "artifacts/aurashield/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25127"
BASE_PATH = "/"
